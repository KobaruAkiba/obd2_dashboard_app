name: odb_dashboard
description: OBD-II vehicle monitor — live dashboard with mock data and hardware stubs.

publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 256
  image_path: assets/icons/obd_app_icon.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/icons/obd_app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
